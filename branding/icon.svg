<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- camera body -->
  <rect x="74" y="166" width="364" height="244" rx="44" fill="url(#cam)"/>
  <!-- viewfinder hump -->
  <path d="M196 166 l18 -34 a16 16 0 0 1 14 -8 h56 a16 16 0 0 1 14 8 l18 34 Z" fill="url(#cam)"/>

  <!-- lens -->
  <circle cx="256" cy="292" r="92" fill="#0b1220"/>
  <circle cx="256" cy="292" r="78" fill="url(#lens)"/>
  <circle cx="256" cy="292" r="40" fill="#0b1220" opacity="0.55"/>
  <circle cx="232" cy="266" r="18" fill="#f0f9ff" opacity="0.85"/>

  <!-- flash spark (the "snap") -->
  <g fill="#fde68a">
    <circle cx="388" cy="212" r="13"/>
    <path d="M388 176 l9 26 -9 -6 -9 6 Z"/>
    <path d="M424 212 l-26 9 6 -9 -6 -9 Z"/>
    <path d="M388 248 l-9 -26 9 6 9 -6 Z"/>
    <path d="M352 212 l26 -9 -6 9 6 9 Z"/>
  </g>
</svg>
