[package]
name = "snap-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
snap-core = { workspace = true }
snap-camera = { workspace = true }
snap-imaging = { workspace = true }
snap-print = { workspace = true }
image = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
async-stream = "0.3"

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

rust-embed = { workspace = true }
mime_guess = { workspace = true }
argon2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Enumerate the device's network interfaces (for QR-code address selection)
local-ip-address = "0.6"

# In-app self-update from GitHub releases
self_update = { version = "0.42", default-features = false, features = [
    "rustls",
    "archive-zip",
    "archive-tar",
    "compression-flate2",
] }

# Sharing
qrcode = "0.14"
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-native-tls",
    "smtp-transport",
    "builder",
] }
