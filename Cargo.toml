[workspace]
resolver = "2"
members = [
    "crates/snap-core",
    "crates/snap-camera",
    "crates/snap-imaging",
    "crates/snap-print",
    "crates/snap-web",
    "snap-bin",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["SnapStation"]

[workspace.dependencies]
# Async runtime & web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace", "fs", "cors"] }
futures = "0.3"
bytes = "1"

# Serialization & data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
rand = "0.8"

# Imaging
image = "0.25"
rayon = "1"

# Assets, auth, errors, logging
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
argon2 = "0.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
snap-core = { path = "crates/snap-core" }
snap-camera = { path = "crates/snap-camera" }
snap-imaging = { path = "crates/snap-imaging" }
snap-print = { path = "crates/snap-print" }
snap-web = { path = "crates/snap-web" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
