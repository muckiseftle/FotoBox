name: Release

# Builds easy-to-run packages for Windows, macOS and Linux and attaches them to
# a GitHub Release whenever a version tag (v*) is pushed.
#
# NOTE: this workflow runs only on GitHub's CI runners (it cannot be validated
# on the Windows dev host). Expect to refine packaging details on the first run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build the PWA once; every OS build embeds the same assets via rust-embed.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: crates/snap-web/assets

  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            short: windows
          - os: macos-latest
            label: macos
            short: macos
          - os: ubuntu-latest
            label: linux-x86_64
            short: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore prebuilt frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: crates/snap-web/assets

      # System libraries for the real camera/printing backends (Linux only).
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgphoto2-dev libcups2-dev libv4l-dev clang

      - name: Build release binary
        run: cargo build --release --bin snapstation

      # ---- Windows: portable zip + optional Inno Setup installer ----
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "stage/SnapStation"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/snapstation.exe "$stage/SnapStation.exe"
          Copy-Item README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/SnapStation-windows-x86_64.zip" -Force
          # Raw .exe asset for the in-app self-updater (no extraction needed;
          # the zip created by Compress-Archive is not readable by self_update).
          Copy-Item target/release/snapstation.exe "dist/SnapStation-windows-x86_64.exe"
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/windows/snapstation.iss
          Copy-Item installer/windows/Output/*.exe dist/

      # ---- macOS: .app bundle inside a .dmg ----
      # There is no Apple Developer certificate, so the app cannot be notarized.
      # Gatekeeper shows "ist beschädigt" for downloaded apps that are unsigned —
      # an ad-hoc signature plus a first-start helper script (removes the
      # quarantine flag) makes the DMG usable without a paid certificate.
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          APP="SnapStation.app/Contents/MacOS"
          mkdir -p "$APP" "SnapStation.app/Contents/Resources"
          cp target/release/snapstation "$APP/SnapStation"
          cp branding/icon.icns "SnapStation.app/Contents/Resources/AppIcon.icns"
          cat > SnapStation.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>SnapStation</string>
            <key>CFBundleDisplayName</key><string>SnapStation</string>
            <key>CFBundleIdentifier</key><string>com.snapstation.app</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>SnapStation</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>SnapStation benötigt die Kamera für Foto-Aufnahmen.</string>
          </dict></plist>
          PLIST
          # Ad-hoc signature: mandatory on Apple Silicon (unsigned binaries are
          # killed on launch) and keeps the bundle's code seal consistent.
          codesign --force --deep --sign - SnapStation.app
          codesign --verify --deep --strict SnapStation.app

          # DMG layout: app + Applications shortcut + install helper that
          # copies the app and strips com.apple.quarantine in one double click.
          mkdir -p dmg
          cp -R SnapStation.app dmg/
          ln -s /Applications dmg/Programme
          cat > "dmg/Installieren.command" <<'CMD'
          #!/bin/bash
          # SnapStation nach /Applications kopieren und die Gatekeeper-Quarantäne
          # entfernen (die App ist nicht notarisiert, sonst meldet macOS
          # faelschlich "SnapStation ist beschaedigt").
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Installiere SnapStation nach /Applications ..."
          rm -rf /Applications/SnapStation.app
          cp -R "$DIR/SnapStation.app" /Applications/
          xattr -cr /Applications/SnapStation.app
          echo "Fertig! SnapStation wird gestartet ..."
          open /Applications/SnapStation.app
          CMD
          chmod +x "dmg/Installieren.command"
          cat > "dmg/BITTE LESEN.txt" <<'TXT'
          SnapStation unter macOS installieren
          ====================================

          Empfohlen: Doppelklick auf "Installieren.command".
          (Falls macOS auch dieses Skript blockiert: Rechtsklick -> Oeffnen.)

          Alternativ von Hand:
          1. SnapStation.app in den Ordner "Programme" ziehen.
          2. Terminal oeffnen und einmalig ausfuehren:
             xattr -cr /Applications/SnapStation.app
          3. SnapStation normal starten.

          Hintergrund: SnapStation ist ein Open-Source-Projekt ohne bezahltes
          Apple-Entwicklerzertifikat. macOS markiert Downloads ohne Apple-
          Notarisierung als "beschaedigt" - die App ist es nicht. Der Befehl
          oben entfernt nur diese Markierung.
          TXT
          hdiutil create -volname SnapStation -srcfolder dmg -ov -format UDZO dist/SnapStation-macos.dmg

      # ---- Linux: portable tarball (binary + station installer) ----
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist stage/SnapStation
          cp target/release/snapstation stage/SnapStation/snapstation
          cp install.sh stage/SnapStation/install.sh
          cp README.md stage/SnapStation/README.md
          cp packaging/snapstation.service stage/SnapStation/snapstation.service
          cp packaging/snapstation.desktop stage/SnapStation/snapstation.desktop
          cp branding/icon.png stage/SnapStation/snapstation.png
          tar -C stage -czf dist/SnapStation-linux-x86_64.tar.gz SnapStation

      # SHA-256 checksums so users can verify downloads (no code signing).
      # NOTE: the checksum filename must NOT contain the self-updater's target
      # string (e.g. "windows-x86_64"), or older clients could mistake it for
      # the program archive. Use the short OS name instead.
      - name: Checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*SHA256SUMS*' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii "dist/SHA256SUMS-${{ matrix.short }}.txt"
      - name: Checksums (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then SUM=sha256sum; else SUM="shasum -a 256"; fi
          $SUM $(ls | grep -v SHA256SUMS) > "SHA256SUMS-${{ matrix.short }}.txt"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
